models:
  - name: dim_film
    description: Film dimension. One film per row.
    columns:
      - name: film_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
  - name: dim_planet
    description: Planet dimension. One planet per row.
    columns:
      - name: planet_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: planet_name
        description: Name of the planet. 'Unknown' is the unknown member, for characters whose homeworld is not known.
        data_tests:
          - not_null
      - name: surface_area_km2
        description: Surface area in km2, calculated as a sphere from diameter_km. NULL if the diameter is unknown.
      - name: population_per_km2
        description: Population per km2 of total surface, land and water. NULL if population or diameter is unknown.
        data_tests:
          - non_negative
  - name: dim_starship
    description: Starship dimension. One starship per row.
    columns:
      - name: starship_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
  - name: dim_character
    description: Character dimension. One character per row.
    columns:
      - name: character_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: homeworld_id
        description: Foreign key to dim_planet. Points to the 'Unknown' planet when the homeworld is not known.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_planet')
                field: planet_id
  - name: fct_character_film_appearance
    description: Which characters appear in which films. One row per character per film.
    data_tests:
      - unique_pair:
          arguments:
            column_a: character_id
            column_b: film_id
    columns:
      - name: character_id
        description: Foreign key to dim_character.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_character')
                field: character_id
      - name: film_id
        description: Foreign key to dim_film.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: film_id
  - name: fct_starship_film_appearance
    description: Which starships appear in which films. One row per starship per film.
    data_tests:
      - unique_pair:
          arguments:
            column_a: starship_id
            column_b: film_id
    columns:
      - name: starship_id
        description: Foreign key to dim_starship.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_starship')
                field: starship_id
      - name: film_id
        description: Foreign key to dim_film.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_film')
                field: film_id
