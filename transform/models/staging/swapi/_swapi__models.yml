models:
  - name: stg_swapi__people
    description: Characters from swapi.dev, one row per person.
    columns:
      - name: person_id
        description: Primary key, extracted from the swapi URL.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Name of the character.
        data_tests:
          - not_null
      - name: gender
        description: Gender as given by the API. 'n/a' = not applicable (e.g. droids).
        data_tests:
          - accepted_values:
              arguments:
                values: ['male', 'female', 'hermaphrodite', 'n/a']
      - name: homeworld_id
        description: Foreign key to stg_swapi__planets.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_swapi__planets')
                field: planet_id
  - name: stg_swapi__films
    description: Films from swapi.dev, one row per film.
    columns:
      - name: film_id
        description: Primary key, extracted from the swapi URL. Not same as episode_id.
        data_tests:
          - unique
          - not_null
      - name: title
        description: Title of the film.
        data_tests:
          - not_null
          - unique
      - name: episode_id
        description: Episode of the film.
        data_tests:
          - not_null
          - unique
      - name: release_date
        description: Release date of the film.
        data_tests:
          - not_null
  - name: stg_swapi__planets
    description: Planets from swapi.dev, one row per planet.
    columns:
      - name: planet_id
        description: Primary key, extracted from the swapi URL.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Name of the planet.
        data_tests:
          - unique
  - name: stg_swapi__starships
    description: Starships from swapi.dev, one row per starship.
    columns:
      - name: starship_id
        description: Primary key, extracted from the swapi URL. IDs have gaps.
        data_tests:
          - unique
          - not_null
      - name: name
        description: Name of the starship.
        data_tests:
          - not_null
          - unique
      - name: cost_in_credits
        description: Price of the starship in galactic credits. NULL if unknown.
        data_tests:
          - non_negative
      - name: passengers
        description: Passenger capacity. 0 is a real value (e.g. fighters). NULL if unknown or n/a.
        data_tests:
          - non_negative
      - name: hyperdrive_rating
        description: Hyperdrive class, lower is faster. NULL if unknown.
        data_tests:
          - non_negative