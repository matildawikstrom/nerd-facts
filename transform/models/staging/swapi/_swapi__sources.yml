sources:
  - name: swapi
    tables:
      - name: people
        meta:
          external_location: >-
              read_json('../data/raw/swapi/people.json', format = 'array', columns = struct_pack(
                name := 'VARCHAR',
                height := 'VARCHAR',
                mass := 'VARCHAR',
                hair_color := 'VARCHAR',
                skin_color := 'VARCHAR',
                eye_color := 'VARCHAR',
                birth_year := 'VARCHAR',
                gender := 'VARCHAR',
                homeworld := 'VARCHAR',
                films := 'VARCHAR[]',
                species := 'VARCHAR[]',
                vehicles := 'VARCHAR[]',
                starships := 'VARCHAR[]',
                created := 'VARCHAR',
                edited := 'VARCHAR',
                url := 'VARCHAR',
                _loaded_at := 'VARCHAR'
              ))
      - name: films
        meta:
          external_location: >-
              read_json('../data/raw/swapi/films.json', format = 'array', columns = struct_pack(
                title := 'VARCHAR',
                episode_id := 'INTEGER',
                opening_crawl := 'VARCHAR',
                director := 'VARCHAR',
                producer := 'VARCHAR',
                release_date := 'DATE',
                characters := 'VARCHAR[]',
                planets := 'VARCHAR[]',
                starships := 'VARCHAR[]',
                vehicles := 'VARCHAR[]',
                species := 'VARCHAR[]',
                created := 'VARCHAR',
                edited := 'VARCHAR',
                url := 'VARCHAR',
                _loaded_at := 'VARCHAR'
              ))
      - name: planets
        meta:
          external_location: >-
              read_json('../data/raw/swapi/planets.json', format = 'array', columns = struct_pack(
                name := 'VARCHAR',
                rotation_period := 'VARCHAR',
                orbital_period := 'VARCHAR',
                diameter := 'VARCHAR',
                climate := 'VARCHAR',
                gravity := 'VARCHAR',
                terrain := 'VARCHAR',
                surface_water := 'VARCHAR',
                population := 'VARCHAR',
                residents := 'VARCHAR[]',
                films := 'VARCHAR[]',
                created := 'VARCHAR',
                edited := 'VARCHAR',
                url := 'VARCHAR',
                _loaded_at := 'VARCHAR'
              ))