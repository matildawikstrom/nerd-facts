name: 'nerd_facts'
version: '1.0.0'

profile: 'nerd_facts'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  nerd_facts:
    # Staging is a table rather than a view: staging reads the raw JSON files by a path relative
    # to transform/, and a view would resolve that path wherever it is queried from.
    staging:
      +materialized: table
    marts:
      +materialized: table
